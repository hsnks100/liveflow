# docker-compose
version: "3.4"
services:
  liveflow:
    image: liveflow_custom:latest
    stdin_open: true # docker run -i
    tty: true # docker run -t
    volumes:
      - "~/.store:/app/bin/videos"
    ports:
      - "8044:8044"
      - "1930:1930"
      - "40000-41000:40000-41000/udp"
    environment:
      DOCKER_MODE: "true"
    build:
      context: ./
      dockerfile: Dockerfile
